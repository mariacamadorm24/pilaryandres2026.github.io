<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Pilar &amp; Andrés — 31 de Octubre de 2026</title>
<meta name="description" content="Acompáñanos a celebrar la boda de Pilar y Andrés el 31 de octubre de 2026 en Vélez, Santander. Confirma tu asistencia aquí." />

<!-- Open Graph -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Pilar & Andrés — 31 de Octubre de 2026" />
<meta property="og:description" content="Acompáñanos a celebrar nuestra boda el 31 de octubre de 2026 en Vélez, Santander." />
<meta property="og:image" content="assets/og-cover.jpg" />

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='31' fill='%23f6f0e3' stroke='%23a9822f' stroke-width='1.5'/%3E%3Ctext x='32' y='40' font-family='Georgia,serif' font-size='24' font-style='italic' text-anchor='middle' fill='%236e3856'%3EP%26A%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,460;0,9..144,500;0,9..144,600;1,9..144,400;1,9..144,500&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ==================== Bordes florales fijos (solo pantallas grandes) ==================== -->
<div class="page-border page-border--left" aria-hidden="true">
  <svg viewBox="0 0 400 500"><use href="#orn-watercolor-spray"/></svg>
</div>
<div class="page-border page-border--right" aria-hidden="true">
  <svg viewBox="0 0 400 500"><use href="#orn-watercolor-spray"/></svg>
</div>

<!-- ======================= SVG SPRITE — ornamentos botánicos ======================= -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>

    <filter id="wc" x="-40%" y="-40%" width="180%" height="180%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02 0.032" numOctaves="2" seed="11" result="wc-noise"/>
      <feDisplacementMap in="SourceGraphic" in2="wc-noise" scale="7" xChannelSelector="R" yChannelSelector="G" result="wc-disp"/>
      <feGaussianBlur in="wc-disp" stdDeviation="1.7"/>
    </filter>
    <filter id="wc-soft" x="-60%" y="-60%" width="220%" height="220%">
      <feTurbulence type="fractalNoise" baseFrequency="0.01 0.018" numOctaves="2" seed="4" result="wc-noise-2"/>
      <feDisplacementMap in="SourceGraphic" in2="wc-noise-2" scale="20" xChannelSelector="R" yChannelSelector="G" result="wc-disp-2"/>
      <feGaussianBlur in="wc-disp-2" stdDeviation="5.5"/>
    </filter>
    <filter id="wc-fine" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.03 0.05" numOctaves="2" seed="9" result="wc-noise-3"/>
      <feDisplacementMap in="SourceGraphic" in2="wc-noise-3" scale="3.5" xChannelSelector="R" yChannelSelector="G"/>
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>

    <!-- Ilustración estilo acuarela: rosas rosa pastel + follaje salvia + acentos dorados -->
    <g id="orn-watercolor-spray">

      <!-- lavado de fondo -->
      <g filter="url(#wc-soft)">
        <ellipse cx="190" cy="260" rx="200" ry="230" fill="#F3E6DE" opacity="0.55"/>
        <ellipse cx="230" cy="140" rx="120" ry="95" fill="#E9EEDF" opacity="0.5"/>
        <ellipse cx="120" cy="230" rx="95" ry="120" fill="#F3D9DE" opacity="0.5"/>
        <ellipse cx="260" cy="360" rx="90" ry="100" fill="#EDE3CE" opacity="0.4"/>
      </g>

      <!-- tallos y hojas de salvia -->
      <g filter="url(#wc)">
        <path d="M20 460 C 40 380, 60 300, 110 240 C 140 204, 176 176, 216 156" fill="none" stroke="#5F6E4F" stroke-width="5" stroke-linecap="round" opacity="0.55"/>
        <path d="M60 400 C 82 388, 102 392, 118 372 C 104 396, 108 416, 90 430 C 78 420, 66 410, 60 400 Z" fill="#7C8C68" opacity="0.7"/>
        <path d="M100 340 C 122 330, 140 336, 154 316 C 142 338, 146 358, 130 372 C 118 362, 106 350, 100 340 Z" fill="#8A9A78" opacity="0.65"/>
        <path d="M150 268 C 170 256, 190 260, 202 240 C 192 262, 196 282, 182 296 C 170 288, 158 278, 150 268 Z" fill="#7C8C68" opacity="0.6"/>
        <path d="M330 320 C 316 260, 316 204, 336 154 C 348 124, 366 100, 388 82" fill="none" stroke="#5F6E4F" stroke-width="5" stroke-linecap="round" opacity="0.5"/>
        <path d="M300 220 C 320 212, 334 220, 350 202 C 340 222, 342 240, 328 252 C 316 244, 306 232, 300 220 Z" fill="#8A9A78" opacity="0.55"/>
      </g>

      <!-- rosa principal, grande -->
      <g filter="url(#wc)" transform="translate(272,140)">
        <ellipse cx="0" cy="0" rx="46" ry="36" fill="#EFC0CB" opacity="0.55"/>
        <ellipse cx="14" cy="-8" rx="34" ry="27" fill="#E5A2B4" opacity="0.55" transform="rotate(32)"/>
        <ellipse cx="-10" cy="10" rx="32" ry="24" fill="#E5A2B4" opacity="0.5" transform="rotate(-38)"/>
        <ellipse cx="2" cy="0" rx="24" ry="19" fill="#D5859C" opacity="0.6" transform="rotate(68)"/>
        <ellipse cx="5" cy="-3" rx="16" ry="12" fill="#C2607A" opacity="0.65" transform="rotate(18)"/>
        <ellipse cx="-3" cy="4" rx="9" ry="7" fill="#A54D66" opacity="0.6"/>
      </g>

      <!-- rosa mediana -->
      <g filter="url(#wc)" transform="translate(118,300) scale(0.78)">
        <ellipse cx="0" cy="0" rx="46" ry="36" fill="#EFC0CB" opacity="0.55"/>
        <ellipse cx="14" cy="-8" rx="34" ry="27" fill="#E5A2B4" opacity="0.55" transform="rotate(-25)"/>
        <ellipse cx="-10" cy="10" rx="32" ry="24" fill="#E5A2B4" opacity="0.5" transform="rotate(44)"/>
        <ellipse cx="2" cy="0" rx="24" ry="19" fill="#D5859C" opacity="0.6" transform="rotate(-60)"/>
        <ellipse cx="5" cy="-3" rx="16" ry="12" fill="#C2607A" opacity="0.65" transform="rotate(10)"/>
        <ellipse cx="-3" cy="4" rx="9" ry="7" fill="#A54D66" opacity="0.6"/>
      </g>

      <!-- capullo pequeño -->
      <g filter="url(#wc)" transform="translate(304,390) scale(0.5)">
        <ellipse cx="0" cy="0" rx="46" ry="36" fill="#EFC0CB" opacity="0.6"/>
        <ellipse cx="10" cy="-4" rx="30" ry="24" fill="#D5859C" opacity="0.6" transform="rotate(20)"/>
        <ellipse cx="-4" cy="4" rx="18" ry="14" fill="#C2607A" opacity="0.65"/>
      </g>

      <!-- flores de relleno -->
      <g filter="url(#wc-fine)" transform="translate(196,90)">
        <g fill="#F6DEE2" opacity="0.85">
          <ellipse cx="0" cy="-11" rx="7" ry="10"/>
          <ellipse cx="10" cy="-3" rx="7" ry="10" transform="rotate(72 10 -3)"/>
          <ellipse cx="7" cy="9" rx="7" ry="10" transform="rotate(144 7 9)"/>
          <ellipse cx="-7" cy="9" rx="7" ry="10" transform="rotate(216 -7 9)"/>
          <ellipse cx="-10" cy="-3" rx="7" ry="10" transform="rotate(288 -10 -3)"/>
        </g>
        <circle r="4.4" fill="#C9A227"/>
      </g>
      <g filter="url(#wc-fine)" transform="translate(78,206) scale(0.85)">
        <g fill="#F6DEE2" opacity="0.85">
          <ellipse cx="0" cy="-11" rx="7" ry="10"/>
          <ellipse cx="10" cy="-3" rx="7" ry="10" transform="rotate(72 10 -3)"/>
          <ellipse cx="7" cy="9" rx="7" ry="10" transform="rotate(144 7 9)"/>
          <ellipse cx="-7" cy="9" rx="7" ry="10" transform="rotate(216 -7 9)"/>
          <ellipse cx="-10" cy="-3" rx="7" ry="10" transform="rotate(288 -10 -3)"/>
        </g>
        <circle r="4.4" fill="#C9A227"/>
      </g>

      <!-- racimos de bayas doradas -->
      <g opacity="0.85">
        <circle cx="336" cy="90" r="3.6" fill="#C9A227"/>
        <circle cx="345" cy="98" r="3" fill="#C9A227" opacity="0.85"/>
        <circle cx="340" cy="108" r="2.6" fill="#B08D3E" opacity="0.75"/>
        <circle cx="52" cy="270" r="3.2" fill="#C9A227"/>
        <circle cx="60" cy="280" r="2.6" fill="#B08D3E" opacity="0.8"/>
      </g>

      <!-- salpicaduras de acuarela -->
      <g opacity="0.8">
        <circle cx="352" cy="220" r="2.4" fill="#C2607A" opacity="0.5"/>
        <circle cx="366" cy="240" r="1.8" fill="#C2607A" opacity="0.4"/>
        <circle cx="46" cy="120" r="2.6" fill="#7C8C68" opacity="0.5"/>
        <circle cx="30" cy="140" r="1.8" fill="#7C8C68" opacity="0.4"/>
        <circle cx="200" cy="440" r="2.2" fill="#C9A227" opacity="0.55"/>
        <circle cx="222" cy="456" r="1.6" fill="#C2607A" opacity="0.45"/>
        <circle cx="150" cy="60" r="2" fill="#8C5468" opacity="0.4"/>
        <circle cx="376" cy="330" r="2.2" fill="#7C8C68" opacity="0.45"/>
      </g>
    </g>

    <!-- Divisor: ramita horizontal con una pequeña flor central -->
    <g id="orn-divider">
      <path d="M0 20 C 40 20, 60 8, 100 8 C 108 8, 112 16, 120 16 C 128 16, 132 8, 140 8 C 180 8, 200 20, 240 20"
            fill="none" stroke="#C9A227" stroke-width="1.3" stroke-linecap="round"/>
      <circle cx="120" cy="16" r="3.6" fill="#C2607A"/>
      <path d="M110 14 C 105 8, 108 2, 114 2 C 112 8, 114 12, 110 14 Z" fill="#8C5468" opacity="0.8"/>
      <path d="M130 14 C 135 8, 132 2, 126 2 C 128 8, 126 12, 130 14 Z" fill="#8C5468" opacity="0.8"/>
    </g>

  </defs>
</svg>

<!-- ================================= HERO ================================= -->
<header class="hero" id="hero">
  <svg class="hero__ornament hero__ornament--tl" viewBox="0 0 400 500"><use href="#orn-watercolor-spray"/></svg>
  <svg class="hero__ornament hero__ornament--br" viewBox="0 0 400 500"><use href="#orn-watercolor-spray"/></svg>

  <p class="hero__kicker" id="hero-kicker"></p>
  <h1 class="hero__names" id="hero-names" aria-label="Pilar y Andrés"></h1>

  <p class="hero__meta">
    <span id="hero-date"></span>
    <span class="dot" aria-hidden="true">·</span>
    <span id="hero-place"></span>
  </p>

  <div class="hero__scroll" aria-hidden="true">
    <span>Desliza</span>
    <span class="hero__scroll-line"></span>
  </div>
</header>

<main>

  <!-- ============================ BIENVENIDA ============================ -->
  <section class="section welcome" id="welcome">
    <svg class="section-bloom section-bloom--welcome" viewBox="0 0 400 500" aria-hidden="true"><use href="#orn-watercolor-spray"/></svg>
    <div class="container">
      <p class="eyebrow reveal" id="welcome-eyebrow"></p>
      <p class="welcome__message reveal reveal-delay-1" id="welcome-message"></p>
      <p class="welcome__signature reveal reveal-delay-2" id="welcome-signature"></p>
    </div>
  </section>

  <div class="divider-sprig reveal" aria-hidden="true"><svg viewBox="0 0 240 24"><use href="#orn-divider"/></svg></div>

  <!-- ============================ INFO DEL EVENTO ============================ -->
  <section class="section section--tinted" id="evento" aria-labelledby="evento-heading">
    <div class="container">
      <p class="eyebrow reveal">Información del evento</p>
      <h2 class="display-lg reveal" id="evento-heading">Fecha y lugar</h2>

      <div class="datetime-row reveal reveal-delay-1">
        <div class="datetime-row__item">
          <span class="num" id="evento-dia"></span>
          <span class="lbl" id="evento-mes"></span>
        </div>
        <div class="datetime-row__item">
          <span class="num" id="evento-hora"></span>
          <span class="lbl">Hora</span>
        </div>
      </div>

      <div class="event-grid">
        <article class="event-card reveal reveal-delay-1">
          <p class="event-card__label" id="ceremonia-label"></p>
          <p class="event-card__venue" id="ceremonia-venue"></p>
          <p class="event-card__place" id="ceremonia-place"></p>
          <a class="btn" id="ceremonia-map" target="_blank" rel="noopener noreferrer">Ver ubicación</a>
        </article>

        <article class="event-card reveal reveal-delay-2">
          <p class="event-card__label" id="recepcion-label"></p>
          <p class="event-card__venue" id="recepcion-venue"></p>
          <p class="event-card__place" id="recepcion-place"></p>
          <a class="btn" id="recepcion-map" target="_blank" rel="noopener noreferrer">Ver ubicación</a>
        </article>
      </div>
    </div>
  </section>

  <div class="divider-sprig reveal" aria-hidden="true"><svg viewBox="0 0 240 24"><use href="#orn-divider"/></svg></div>

  <!-- ============================ ITINERARIO ============================ -->
  <section class="section" id="itinerario" aria-labelledby="itinerario-heading">
    <div class="container">
      <p class="eyebrow reveal">El día</p>
      <h2 class="display-lg reveal" id="itinerario-heading">Itinerario</h2>
      <ol class="timeline" id="timeline-list"></ol>
    </div>
  </section>

  <div class="divider-sprig reveal" aria-hidden="true"><svg viewBox="0 0 240 24"><use href="#orn-divider"/></svg></div>

  <!-- ============================ DRESS CODE ============================ -->
  <section class="section section--tinted" id="dresscode" aria-labelledby="dresscode-heading">
    <svg class="section-bloom section-bloom--dresscode" viewBox="0 0 400 500" aria-hidden="true"><use href="#orn-watercolor-spray"/></svg>
    <div class="container">
      <p class="eyebrow reveal">Cómo vestir</p>
      <h2 class="display-lg reveal" id="dresscode-heading"></h2>

      <div class="dress-grid">
        <div class="dress-role reveal reveal-delay-1">
          <p class="dress-role__title">Hombres</p>
          <p class="dress-role__text" id="dress-men"></p>
        </div>
        <div class="dress-role reveal reveal-delay-2">
          <p class="dress-role__title">Mujeres</p>
          <p class="dress-role__text" id="dress-women"></p>
        </div>
      </div>

      <div class="reserved-color reveal reveal-delay-2">
        <span class="reserved-color__swatch" id="reserved-swatch" aria-hidden="true"></span>
        <p class="reserved-color__text" id="reserved-text"></p>
      </div>
    </div>
  </section>

  <div class="divider-sprig reveal" aria-hidden="true"><svg viewBox="0 0 240 24"><use href="#orn-divider"/></svg></div>

  <!-- ============================ INFO ADICIONAL ============================ -->
  <section class="section" id="info-adicional" aria-labelledby="info-adicional-heading">
    <svg class="section-bloom section-bloom--info" viewBox="0 0 400 500" aria-hidden="true"><use href="#orn-watercolor-spray"/></svg>
    <div class="container">
      <p class="eyebrow reveal">Para tener en cuenta</p>
      <h2 class="display-lg reveal" id="info-adicional-heading">Información adicional</h2>
      <div class="info-grid" id="info-grid"></div>
    </div>
  </section>

  <div class="divider-sprig reveal" aria-hidden="true"><svg viewBox="0 0 240 24"><use href="#orn-divider"/></svg></div>

  <!-- ============================ RSVP ============================ -->
  <section class="section section--tinted" id="rsvp" aria-labelledby="rsvp-heading">
    <svg class="section-bloom section-bloom--rsvp" viewBox="0 0 400 500" aria-hidden="true"><use href="#orn-watercolor-spray"/></svg>
    <div class="container">
      <div class="rsvp__intro">
        <p class="eyebrow reveal" id="rsvp-heading-eyebrow">Confirma tu asistencia</p>
        <h2 class="display-lg reveal" id="rsvp-heading">RSVP</h2>
        <p class="rsvp__deadline reveal" id="rsvp-deadline"></p>
      </div>

      <form class="form reveal reveal-delay-1" id="rsvp-form" novalidate>

        <div class="field">
          <label for="f-nombre">Nombre completo</label>
          <input type="text" id="f-nombre" name="nombre" autocomplete="name" required aria-required="true" />
          <p class="field-error" id="err-nombre"></p>
        </div>

        <div class="field">
          <label for="f-telefono">Número de teléfono</label>
          <input type="tel" id="f-telefono" name="telefono" autocomplete="tel" required aria-required="true" />
          <p class="field-error" id="err-telefono"></p>
        </div>

        <fieldset class="fieldset field">
          <legend>Confirmación de asistencia</legend>
          <div class="radio-row" id="asistencia-options"></div>
          <p class="field-error" id="err-asistencia"></p>
        </fieldset>

        <div class="field">
          <label for="f-restriccion">Restricciones alimenticias</label>
          <select id="f-restriccion" name="restriccion" required aria-required="true">
            <option value="" disabled selected>Selecciona una opción</option>
          </select>
          <p class="field-error" id="err-restriccion"></p>
        </div>

        <div class="field field--conditional" id="detalle-wrapper">
          <label for="f-detalle">Cuéntanos cuál</label>
          <input type="text" id="f-detalle" name="detalleRestriccion" />
        </div>

        <div class="field">
          <label for="f-comentarios">Comentarios (opcional)</label>
          <textarea id="f-comentarios" name="comentarios" rows="3"></textarea>
        </div>

        <div class="form__submit">
          <button type="submit" class="btn btn--solid" id="rsvp-submit">Enviar confirmación</button>
          <span class="spinner" role="status" aria-live="polite" aria-label="Enviando"></span>
        </div>

        <p class="form-status" id="form-status" role="status" aria-live="polite"></p>
      </form>

      <div class="rsvp-success" id="rsvp-success" hidden>
        <svg class="rsvp-success__icon" viewBox="0 0 64 64" fill="none" aria-hidden="true">
          <circle cx="32" cy="32" r="30" stroke="currentColor" stroke-width="1.4"/>
          <path d="M20 33 L28 41 L45 23" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
        </svg>
        <p class="rsvp-success__text" id="rsvp-success-text"></p>
      </div>
    </div>
  </section>

</main>

<!-- ============================ FOOTER / CONFIRMACIÓN FINAL ============================ -->
<footer class="footer">
  <div class="divider-sprig reveal" aria-hidden="true" style="margin-bottom:32px;"><svg viewBox="0 0 240 24"><use href="#orn-divider"/></svg></div>
  <p class="footer__names" id="footer-names"></p>
  <p class="footer__date" id="footer-date"></p>
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
